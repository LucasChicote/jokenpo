trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Build
    displayName: "Build e Push para ACR"
    jobs:
      - job: BuildAndPush
        steps:

          - task: Docker@2
            displayName: "Build da imagem"
            inputs:
              containerRegistry: "pythonmssqlrm559366"
              repository:        "pythonsql"
              command:           "build"
              Dockerfile:        "**/Dockerfile"
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: "Push para ACR"
            inputs:
              containerRegistry: "pythonmssqlrm559366"
              repository:        "pythonsql"
              command:           "push"
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: "Deploy no ACI"
    dependsOn: Build
    jobs:
      - job: DeployACI
        steps:

          - task: AzureCLI@2
            displayName: "Criar container no ACI"
            inputs:
              azureSubscription: "Azure for Students (09c004c8-b4c2-42ce-bbc2-c91c252995eb)"
              scriptType:        "bash"
              scriptLocation:    "inlineScript"
              inlineScript: |
                az container delete \
                  --resource-group cp3-docker-ci-cd \
                  --name pythonmssqlrm559366 \
                  --yes

                az container create \
                  --resource-group cp3-docker-ci-cd \
                  --name pythonmssqlrm559366 \
                  --image pythonmssqlrm559366.azurecr.io/pythonsql:latest \
                  --cpu 2 \
                  --memory 2 \
                  --os-type Linux \
                  --registry-login-server pythonmssqlrm559366.azurecr.io \
                  --registry-username pythonmssqlrm559366 \
                  --registry-password "3muT7V2asbVxQTRzJ0mptmjn9gVTFzrS2AGAqze4XqIbV6A4mVSyJQQJ99CEACZoyfiEqg7NAAACAZCR0uyW" \
                  --dns-name-label pythonmssqlrm559366 \
                  --restart-policy Always \
                  --ports 80 \
                  --environment-variables \
                      DB_USER="user-dimdimsql" \
                      DB_PASSWORD="Jokenpo@2026!" \
                      DB_HOST="sql-server-dimdim-rm559366-brazilsouth.database.windows.net" \
                      DB_NAME="db-dimdim"
